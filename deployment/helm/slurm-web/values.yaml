# Default values for slurm-web deployment
# This is a YAML-formatted file.
#
# For split deployment, use:
#   values-gateway.yaml - Gateway + Redis + Ingress (target: pi namespace)
#   values-agent.yaml   - Agent only (target: slurm namespace)

# Gateway configuration
gateway:
  enabled: true
  image: "ociscloud/slurm-web:gateway-latest"
  pullPolicy: Always
  replicaCount: 1

  service:
    type: ClusterIP
    port: 5011

  # Agent URL (override for cross-namespace deployment)
  agentUrl: "http://slurm-web-agent:5012"

  # Ingress configuration
  ingress:
    enabled: true
    className: kong
    host: "slurm-web-61-222-206-87.sslip.io"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: "slurm-web-tls"

  # Authentication method: "ldap", "jwt", or "none"
  auth:
    method: "ldap"

  # LDAP configuration (used when auth.method = "ldap")
  ldap:
    uri: "ldap://openldap.openldap.svc.cluster.local:389"
    userBase: "ou=users,ou=ocis,dc=asus,dc=com"
    groupBase: "ou=groups,ou=ocis,dc=asus,dc=com"
    bindDn: "cn=admin,dc=asus,dc=com"
    bindPasswordSecret:
      name: "auth-proxy"
      key: "LDAP_BIND_PASSWORD"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Agent configuration
agent:
  enabled: true
  image: "ociscloud/slurm-web:agent-latest"
  pullPolicy: Always
  replicaCount: 1

  service:
    type: ClusterIP
    port: 5012

  slurmrestd:
    uri: "http://slurm-restapi.slurm.svc.cluster.local:6820"
    version: "v0.0.40"
    # Existing K8s secret for slurmrestd JWT auth (set to null to use shared key)
    jwtSecret:
      name: "slurm-auth-jwths256"
      key: "jwt_hs256.key"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Redis configuration
redis:
  enabled: true
  external: false  # Set true to skip deploying Redis (use existing instance)
  # host: ""       # Override Redis hostname (for external/cross-namespace Redis)
  image: "redis:alpine"
  pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: false

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Secrets configuration
secrets:
  # JWT secret key for slurm-web internal auth (gateway <-> agent)
  # Must be at least 32 characters. Generate with: openssl rand -base64 32
  jwtKey: "NYH4zNkBGbFPe4yt+rShKqgUmi4Ep6ig9r+VqZy/JvI="

# Image pull secrets (for private registry)
imagePullSecrets:
  - name: regcred-ocis

# Common labels
commonLabels:
  app.kubernetes.io/part-of: slurm-web
  app.kubernetes.io/managed-by: helm
