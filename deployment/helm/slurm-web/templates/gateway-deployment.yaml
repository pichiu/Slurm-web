{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slurm-web.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ include "slurm-web.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "slurm-web.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "slurm-web.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: "{{ .Values.gateway.image }}"
        imagePullPolicy: {{ .Values.gateway.pullPolicy }}
        command: ["slurm-web"]
        args: ["gateway", "--conf-defs", "/usr/share/slurm-web/conf/vendor/gateway.yml", "--conf", "/etc/slurm-web/gateway.ini"]
        ports:
        - name: http
          containerPort: 5011
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/slurm-web
          readOnly: true
        - name: jwt-key
          mountPath: /var/lib/slurm-web
          readOnly: true
        {{- if and (eq .Values.gateway.auth.method "ldap") .Values.gateway.ldap.bindDn }}
        - name: ldap-bind-password
          mountPath: /etc/slurm-web-secrets/ldap-bind-password
          subPath: {{ .Values.gateway.ldap.bindPasswordSecret.key }}
          readOnly: true
        {{- end }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "slurm-web.fullname" . }}-gateway
      - name: jwt-key
        secret:
          secretName: {{ include "slurm-web.fullname" . }}-jwt
          defaultMode: 0400
      {{- if and (eq .Values.gateway.auth.method "ldap") .Values.gateway.ldap.bindDn }}
      - name: ldap-bind-password
        secret:
          secretName: {{ .Values.gateway.ldap.bindPasswordSecret.name }}
          defaultMode: 0400
      {{- end }}
{{- end }}
